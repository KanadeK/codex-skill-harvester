name: Bug report
description: Report reproducible scanner, decision, validation, or packaging behavior.
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the command, sanitized output, and the affected source or candidate ID.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.1 or full commit SHA
    validations:
      required: true
  - type: dropdown
    id: external-content
    attributes:
      label: Does the report contain external content?
      options:
        - "No"
        - "Yes, only sanitized facts and links"
    validations:
      required: true
