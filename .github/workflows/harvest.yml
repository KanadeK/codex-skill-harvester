name: Scheduled harvest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: scheduled-harvest
  cancel-in-progress: false

jobs:
  campaign:
    name: run bounded harvest campaign
    if: github.repository == 'KanadeK/codex-skill-harvester'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run canary and bounded ramp from persisted cursors
        id: campaign
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output="$(python -m skill_harvester campaign --root . --ramp)"
          printf '%s\n' "$output"
          if [[ "$output" == status=changed* || "$output" == status=checkpoint* ]]; then
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          elif [[ "$output" == status=no_op* ]]; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'Unexpected campaign result: %s\n' "$output" >&2
            exit 1
          fi
      - name: Open a review-only harvest pull request
        if: steps.campaign.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="codex/harvest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state/harvest.sqlite3 runs
          if git diff --cached --quiet; then
            printf 'Campaign reported changes but produced no reviewable diff.\n' >&2
            exit 1
          fi
          git commit -m "chore: checkpoint bounded public-source campaign"
          git push --set-upstream origin "$branch"
          gh pr create \
            --title "chore: review harvested public-source changes" \
            --body "Automated bounded campaign only: canary, stop-loss, checkpoint, and ramp all ran through the campaign policy. Observations remain evidence until explicit workflow normalization promotes a candidate. No L4 merge, publication, Release, external source body, or third-party script was executed."
          gh workflow run ci.yml --ref "$branch"
