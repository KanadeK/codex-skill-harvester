name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned build backend
        run: python -m pip install "setuptools==84.0.0"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run Skill evaluations
        run: python scripts/run_evals.py
      - name: Validate repository and generated artifacts
        run: python scripts/validate_repo.py
      - name: Build deterministic release assets
        run: python scripts/build_release.py
      - name: Install source archive and invoke CLI
        run: python scripts/verify_release_archive.py
      - name: Confirm checks did not mutate tracked files
        run: git diff --exit-code
