[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-skill-harvester"
version = "0.2.0"
description = "会过日子 · Human Skills — Evidence-reviewed bilingual Codex Skills for everyday life and software"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "KanadeK" }]
dependencies = []

[project.scripts]
skill-harvester = "skill_harvester.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
